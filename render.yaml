services:
  - type: web
    name: project-kp
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.23.4
      - key: DATABASE_URL
        fromDatabase:
          name: project-kp-db
          property: connectionString
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: project-kp
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_NAME
        value: Admin Support B2G
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
databases:
  - name: project-kp-db
    databaseName: b2g_dashboard
    user: b2g
    plan: 0.1c-256mb
    postgresMajorVersion: '17'
